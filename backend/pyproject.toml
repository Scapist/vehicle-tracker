[project]
name = "vehicle-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21,<22",
    "tzdata>=2024.2",
    "httpx>=0.27",
    "discord-py>=2.4",
    "mcp>=1.9",
]

[dependency-groups]
dev = ["pytest>=8", "time-machine>=2.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
