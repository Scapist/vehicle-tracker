services:
  tracker:
    build: .
    image: vehicle-tracker
    container_name: vehicle-tracker
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 512m
    cap_drop: [ALL]
    # only what the entrypoint needs to hand ./data to the app user and then switch to it
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
